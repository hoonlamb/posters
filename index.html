<html lang="ko">

<meta property="og:title" content="전시 포스터 아카이브">
<meta property="og:description" content="11~12월 대학 미술·디자인 졸업전시 포스터를 날짜·장소·지도와 함께 한 판에 모았어요. 미술관·갤러리 전시도 포스터로 골라 보세요.">

<title>전시 포스터 아카이브</title>
<style>
:root{
  --bg:#08080a; --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.17);
  --text:#f6f6f4; --dim:rgba(246,246,244,.64); --faint:rgba(246,246,244,.38); --accent:#fff; --accent-ink:#0a0a0b;
  --glass:rgba(18,18,20,.52); --blur:blur(22px) saturate(150%);
  --font:"J직지고딕",JJGothic,Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --side:244px; --top:48px; --scope:54px; --hist:44px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 18% 12%,rgba(255,255,255,.16),transparent 70%),radial-gradient(34% 30% at 85% 30%,rgba(255,255,255,.1),transparent 70%),radial-gradient(40% 36% at 50% 95%,rgba(255,255,255,.12),transparent 70%);filter:blur(30px);pointer-events:none}
body{background:var(--bg);color:var(--text);font:400 13px/1.45 var(--font);letter-spacing:-.02em;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);z-index:30}
.brand{font-weight:700;font-size:14px;white-space:nowrap}
.stat{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.search{flex:none;width:calc(var(--side) - 30px);display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--panel);transition:border-color .15s}
.search:focus-within{border-color:var(--dim)}
.search svg{flex:none;color:var(--dim)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0}
.search input::placeholder{color:var(--faint)}
.search kbd{display:none;font:500 11px var(--font);color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.top .sp{flex:1}
.filter-btn{display:none;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;white-space:nowrap}

.seg{position:relative;display:inline-flex;border:1px solid var(--line2);border-radius:9px;padding:2px;background:var(--panel);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.seg button{position:relative;z-index:1;padding:5px 9px;border-radius:7px;color:var(--dim);font-weight:500;white-space:nowrap;transition:color .2s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{color:var(--accent-ink);font-weight:600}
.seg .n{margin-left:5px;font-weight:400;opacity:.62;font-variant-numeric:tabular-nums}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:7px;background:var(--accent);transition:transform .34s var(--ease),width .34s var(--ease)}
.seg.tabs button[aria-selected=true]{color:var(--accent-ink)}

.scope{position:fixed;top:var(--top);left:var(--side);right:0;height:var(--scope);display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);z-index:12;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.scope::-webkit-scrollbar{display:none}
.scope .lab{color:var(--faint);font-size:11px;font-weight:600;margin-right:-6px}
.quick{display:flex;gap:6px}
.pill{padding:5px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--dim);font-weight:500;transition:background-color .2s,color .2s,border-color .2s}
.pill:hover{color:var(--text);border-color:var(--dim)}
.pill{background:var(--panel);height:30px;display:inline-flex;align-items:center}
select.pill{padding:0 10px;appearance:none;-webkit-appearance:none;cursor:pointer}
#gPop{position:fixed;inset:auto;margin:0;padding:12px;width:290px;border-radius:14px;border:1px solid var(--line2);background:rgba(20,20,22,.68);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);color:var(--text);flex-wrap:wrap;gap:6px}
#gPop:popover-open{display:flex}
#gPop hr{flex:1 0 100%;border:0;border-top:1px solid var(--line);margin:4px 0}
.pill[aria-pressed=true]{border-color:rgba(255,255,255,.7);color:#fff;background:rgba(255,255,255,.16)}
.quick .pill .n,#segFee .n{display:none}
.pill .n{margin-left:4px;opacity:.6;font-weight:400;font-variant-numeric:tabular-nums}

.side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);overflow:auto;padding:14px 14px 24px;border-right:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);z-index:20}
.side h3{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.02em;margin:18px 0 8px}
.side h3:first-child{margin-top:0}
.side h4 span{font-weight:400;margin-left:4px;opacity:.7}
.more summary,.fold summary{cursor:pointer;color:var(--dim);font-size:11.5px;padding:6px;list-style:none;border-radius:6px}
.more summary:hover,.fold summary:hover{color:var(--text);background:rgba(255,255,255,.04)}
.fold summary{font-weight:600;color:var(--faint);font-size:11px;margin-top:14px}
.side h4{font-size:11px;font-weight:600;color:var(--faint);margin:12px 6px 4px}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border-radius:6px;color:var(--dim);text-align:left;transition:background-color .15s,color .15s}
.row:hover{background:var(--panel);color:var(--text)}
.row[aria-pressed=true]{color:var(--text);background:rgba(255,255,255,.12)}
.row .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);flex:none;transition:background-color .2s,transform .3s var(--ease)}
.row[aria-pressed=true] .dot{background:var(--accent);transform:scale(1.25)}
.row .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--faint)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--dim);transition:background-color .2s,color .2s,border-color .2s}
.chip{background:var(--panel)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.side select{width:100%;height:32px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
.side input[type=range]{width:100%;accent-color:var(--accent)}
.reset{margin-top:14px;padding:6px 12px;border:1px solid var(--line2);border-radius:8px;color:var(--dim);width:100%}
.reset:hover{color:var(--text);border-color:var(--dim)}
.sz{position:fixed;left:calc(var(--side) + 16px);bottom:calc(var(--hist) + 14px);z-index:15;display:flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.sz input{width:84px;height:14px;accent-color:#fff;background:none}
.hint{color:var(--faint);font-size:11.5px;margin-top:20px;line-height:1.6}

.main{position:fixed;inset:0;overflow:auto;padding:calc(var(--top) + var(--scope) + 14px) 16px calc(var(--hist) + 56px) calc(var(--side) + 16px);scroll-behavior:smooth}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.af{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border:1px solid rgba(255,255,255,.6);border-radius:999px;color:#fff;background:rgba(255,255,255,.1)}
.sec{margin-bottom:26px}
.sec h2{position:sticky;top:-10px;z-index:5;margin:0 0 10px;padding:8px 12px;width:max-content;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);font-size:13px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.sec h2 span{font-weight:400;color:var(--dim)}
.grid{position:relative}
.card{position:absolute;left:0;top:0;display:block;overflow:hidden;border-radius:4px;background:var(--panel);cursor:pointer;border:0;padding:0;transform-origin:0 0;will-change:transform}
.card{background:linear-gradient(100deg,#171718 30%,#212123 50%,#171718 70%) 0 0/200% 100%;animation:sk 1.3s linear .18s infinite}
.card.lo{animation:none;background:var(--panel)}
@keyframes sk{to{background-position:-200% 0}}
.card img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s,filter .22s,transform .5s var(--ease)}
.card img.ok{opacity:1}
.card.hs img{height:calc(100% - 24px)}
.card .st{position:absolute;left:0;right:0;bottom:0;z-index:1;height:24px;padding:0 2px;background:var(--bg);font-size:11.5px;line-height:24px;font-weight:500;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-variant-numeric:tabular-nums}
.card .st.on{color:#f0f0ee;font-weight:600}.card .st.soon{color:#c9c9cf}.card .st.end{color:#ff9a88;font-weight:600}
.card .st::before{content:'';display:inline-block;width:6px;height:6px;margin:0 6px 1px 1px;border-radius:50%;vertical-align:middle;background:currentColor;opacity:.9}
.card .st.soon::before{background:none;box-shadow:inset 0 0 0 1.5px currentColor}.card .st:not(.on):not(.soon):not(.end)::before{opacity:.45}
@media (prefers-reduced-motion:reduce){.card,.dimg img.sk,.mi img.sk{animation:none}}
.card:not(.past):hover img.ok{opacity:.94;transform:scale(1.03)}
.card.past img.ok{opacity:.38;filter:saturate(.45) brightness(.9)}
.card.past:hover img.ok,.card.past:focus-visible img.ok{opacity:1;filter:none;transform:scale(1.03)}
.card .cap{position:absolute;inset:auto 6px 6px 6px;padding:8px 9px;border-radius:8px;background:rgba(20,20,22,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .3s var(--ease);text-align:left;pointer-events:none}
.card:hover .cap,.card:focus-visible .cap{opacity:1;transform:none}
.cap b{display:block;font-size:12px;line-height:1.35;font-weight:600}
.cap i{font-style:normal;font-size:11px;color:#b9b9b5}
.card .pin{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.card .tags{position:absolute;left:6px;top:6px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 12px)}
.card .tags span{padding:2px 8px;border-radius:999px;background:rgba(20,20,22,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:600;white-space:nowrap}
.card .free{position:absolute;left:6px;top:6px;padding:2px 8px;border-radius:999px;background:rgba(20,20,22,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:11px;font-weight:600}
.empty{padding:80px 0;text-align:center;color:var(--dim);line-height:1.8}

.hist{position:fixed;left:var(--side);right:0;bottom:0;height:var(--hist);border-top:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);padding:3px 16px 0;z-index:10}
.bars{display:flex;align-items:flex-end;height:28px}
.bar{--h:0;flex:1;min-width:3px;height:100%;position:relative;background:none;padding:0}
.bar::after{content:'';position:absolute;left:22%;right:22%;bottom:0;height:calc(2px + var(--h) * 6px);border-radius:2px;background:rgba(255,255,255,.28);transform-origin:bottom;transition:height .28s var(--ease),background-color .2s,opacity .2s;animation:grow .6s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.bar:hover::after,.bar:focus-visible::after{height:calc(8px + var(--h) * 18px);background:#fff}
.bar:hover + .bar::after,.bar:has(+ .bar:hover)::after{height:calc(5px + var(--h) * 10px);background:rgba(255,255,255,.5)}
.bar[aria-pressed=true]::after{background:#fff;height:calc(6px + var(--h) * 14px)}
.bar.off{opacity:.35}
.years{display:flex;height:11px;color:var(--faint);font-size:9px;line-height:11px}
.years span{flex:1;min-width:3px;overflow:visible;white-space:nowrap}
#tip{position:fixed;z-index:70;pointer-events:none;padding:4px 10px;border-radius:999px;background:rgba(20,20,22,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);font-size:12px;white-space:nowrap;opacity:0;transform:translate(-50%,6px);transition:opacity .15s,transform .2s var(--ease)}
#tip.on{opacity:1;transform:translate(-50%,0)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:40;opacity:0;visibility:hidden;transition:opacity .28s,visibility 0s .28s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .28s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:rgba(16,16,18,.62);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);border-left:1px solid var(--line2);z-index:50;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .22s,visibility 0s .22s}
.drawer.on{opacity:1;visibility:visible;transition:opacity .22s}
.dimg{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);overflow:hidden}
#boot{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--dim);transition:opacity .3s}
#boot i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#boot.off{opacity:0;pointer-events:none}
.srcl{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45)}
.dimg img{display:block;box-shadow:0 8px 40px rgba(0,0,0,.5);background:#ebebe8}
.dmeta{padding:18px 20px 20px;border-top:1px solid var(--line)}
.dmeta h2{font-size:17px;line-height:1.4;font-weight:700;margin-bottom:10px}
.dmeta dl{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;color:var(--dim)}
.dmeta dd{color:var(--text)}
.dact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{height:34px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;display:inline-flex;align-items:center;font-weight:500;color:var(--text);text-decoration:none;transition:transform .2s var(--ease),border-color .15s}
.btn:hover{border-color:var(--dim)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.dclose{position:absolute;top:12px;right:12px;z-index:3;height:32px;padding:0 12px;border-radius:999px;background:rgba(20,20,22,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line2)}
.nav{position:absolute;top:calc(50% - 28px);width:36px;height:56px;background:rgba(20,20,22,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:999px;z-index:3}
.nav.l{left:10px}.nav.r{right:10px}
.ghost{position:fixed;z-index:60;margin:0;pointer-events:none;transform-origin:0 0;object-fit:cover;border-radius:4px;will-change:transform}

.cmp{display:flex;gap:14px;align-items:flex-start;overflow:auto;padding:4px 0 20px}
.cmp figure{flex:none}
.cmp img{display:block;height:min(64vh,640px);width:auto;border-radius:4px;background:#ebebe8}
.cmp figcaption{margin-top:8px;max-width:320px;color:var(--dim)}
.cmp figcaption b{display:block;color:var(--text)}
.pins{display:flex;flex-wrap:wrap;gap:12px}
.pins .card{position:relative;height:340px}
.pins .pc{display:flex;flex-direction:column;gap:2px}.pins .pc>b{margin-top:8px;font-size:13px;font-weight:600;line-height:1.35;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pins .pc>i{font-style:normal;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

@media (min-width:861px){
  :root{--scope:0px}
  .scope{top:0;height:var(--top);left:var(--side);right:104px;border-bottom:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;z-index:31;padding:0 6px 0 0;gap:8px}
}
@media (max-width:860px){
  :root{--side:0px;--hist:44px;--top:92px;--scope:50px}
  .side{width:min(290px,86vw);transform:translateX(-100%);transition:transform .3s var(--ease);z-index:45;border-right:1px solid var(--line2)}
  .side.on{transform:none}
  .filter-btn{display:block}
  .stat,.search kbd{display:none}
  .top{gap:8px;padding:8px 10px;flex-wrap:wrap;align-content:center}
  .top .sp{display:none}
  .brand{flex:1;font-size:13px}
  .search{order:3;flex:1 0 100%;max-width:none}
  .seg.tabs{white-space:nowrap}
  .seg.tabs button{padding:6px 10px}
  .scope{padding:0 10px}
  .main{padding:8px 10px 40px}
  .sec h2{margin:0 0 8px;padding:8px 12px}
  .hist{padding:6px 10px 0}
  .cmp img{height:50vh}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---- 텍스트만으로 구분하는 상단, 여백, 타임라인 (뒤 규칙이 앞 규칙을 덮어요) ---- */
:root{--side:248px;--top:60px;--hist:64px;--pad:32px}
.top{height:var(--top);padding:0 var(--pad);gap:0}
.seg,.seg.tabs{border:0;background:none;box-shadow:none;padding:0;border-radius:0;gap:22px}
.seg .thumb{display:none}
.seg button{padding:0;border-radius:0;color:var(--dim);font-weight:400;height:32px;display:inline-flex;align-items:center}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true],.seg button[aria-selected=true],.seg.tabs button[aria-selected=true]{color:#fff;font-weight:600}
.seg .n{margin-left:5px;font-size:11px;opacity:.5}
#segFee .n{display:none}
.pill,select.pill{border:0;background:none;border-radius:0;padding:0;height:32px;color:var(--dim);font-weight:400}
.pill:hover,select.pill:hover{color:var(--text);border:0}
.pill[aria-pressed=true]{background:none;border:0;color:#fff;font-weight:600}

.cstk img.past{filter:grayscale(1) brightness(.7)}
.cstk:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}
.cn{position:absolute;right:7px;top:6px;pointer-events:none;z-index:14;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--text);font-size:11px;font-weight:700;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.cd.run::after{content:'';position:absolute;left:0;right:0;bottom:5px;height:2px;background:var(--rc,#fff);pointer-events:none;z-index:13}
.cd.run.rs::after{left:10px}
.cd.run.re::after{right:12px}
.cd.run.re::before{content:'';position:absolute;right:8px;bottom:2px;border:4px solid transparent;border-left:7px solid var(--rc,#fff);border-right:0;z-index:13;pointer-events:none}
.calmsg{padding:40px 0 0;color:var(--dim);font-size:14px}
@media (max-width:860px){
  .calh{gap:12px;margin-bottom:12px}
  .cm b{font-size:40px}
  .cm span{font-size:12px}
  .calh{gap:10px 14px;margin-bottom:8px}
  .calh p{order:3;flex-basis:100%;font-size:12px;gap:2px 12px}
  .cw{font-size:9px;letter-spacing:.02em}.cw span{padding-left:3px}
  .cd.today .tl{left:2px;top:auto;bottom:2px;font-size:9px}
  .dn{left:3px;top:3px;font-size:10px}
  .cd.today .dn{left:2px;top:2px;padding:0 4px}
  .cd{overflow:hidden}
  .cstk{inset:17px 4px 6px}
  .cstk img{max-width:90%;box-shadow:0 4px 10px rgba(0,0,0,.5)}
  .cn{right:3px;top:3px;min-width:14px;height:14px;padding:0 3px;font-size:9px;line-height:14px}
  .cd.run::after{bottom:2px}.cd.run.re::before{bottom:-1px;right:2px}
}

/* ---------- 왼쪽 필터 열고 닫기(데스크톱) ---------- */
.stog{display:none;width:30px;height:30px;margin-right:12px;place-items:center;border-radius:8px;color:var(--dim);transition:color .15s,background .15s}
.stog:hover{color:#fff;background:rgba(255,255,255,.08)}
.stog svg{width:17px;height:17px}
@media (min-width:861px){
  .stog{display:grid}
  body.sidecl{--side:0px}
  body.sidecl .side{display:none}
  .search:hover input,.search:focus-within input,.search input:not(:placeholder-shown){width:150px}
}
@media (min-width:1361px){.scope{left:calc(248px + 30px);right:calc(var(--pad) + var(--tabsw,300px))}} /* 빠른 필터 줄이 오른쪽 탭과 겹치지 않게 */
</style>

function hayOf(d) {
  const ms = []; let [y, m] = d.start.slice(0,7).split('-').map(Number); const e = d.end.slice(0,7);
  for (let i = 0; i < 14; i++) { const k = `${y}-${String(m).padStart(2,'0')}`; ms.push(`${y}년 ${m}월`, `${m}월`, `${y}.${String(m).padStart(2,'0')}`); if (k >= e) break; if (++m > 12) { m = 1; y++; } }
  return [d.title, d.inst, d.artist, d.genre, d.place, d.venue, d.cat, d.st, d.fee==='무료'?'무료':'', d.grad?'졸업전시 졸업전':'', ...ms].join(' ').toLowerCase();

function apply(skip) {

  return D.filter(d =>
    (skip==='cat' || !S.cat || d.cat===S.cat) &&
    (skip==='fee' || !S.fee || d.fee===S.fee) &&
    (skip==='quick' || !S.quick ||
      (S.quick==='open' && d.st==='진행중') ||
      (S.quick==='ending' && d.st==='진행중' && d.end<=T14) ||
      (S.quick==='soon' && d.st==='예정' && d.start<=T30) ||
      (S.quick==='past' && d.st==='종료') ||
      (S.quick==='grad' && d.grad)) &&
    (skip==='inst' || !S.inst.size || S.inst.has(d.inst)) &&
    (skip==='genre' || !S.genre.size || S.genre.has(d.genre)) &&
    (skip==='tag' || !S.tag.size || tagList(d).some(t => S.tag.has(t))) &&
    (skip==='month' || !S.month || d.sm===S.month) &&
    qt.every(t => d.hay.includes(t) || (ALIAS[t] && d.hay.includes(ALIAS[t].toLowerCase()))));
}
function sorted(list) {
  const a = list.slice();
  if (S.sort==='now') { const r = d => d.st==='진행중' ? 0 : d.st==='예정' ? 1 : 2; a.sort((x,y) => r(x)-r(y) || (r(x)===0 ? x.end.localeCompare(y.end) : r(x)===1 ? x.start.localeCompare(y.start) : y.end.localeCompare(x.end))); }
  else if (S.sort==='old') a.sort((x,y)=>x.start.localeCompare(y.start));
  else if (S.sort==='end') { a.sort((x,y)=>x.end.localeCompare(y.end)); return a.filter(d=>d.end>=TODAY); }
  else a.sort((x,y)=>y.start.localeCompare(x.start));

}

function flip(prev, dur) {

    const n = c.getBoundingClientRect();

    e.preventDefault(); if (g('amok').disabled) return; g('amok').disabled = true;
    const k = known(), r = {id:'u-' + Date.now().toString(36), title:g('amt1').value.trim(), start:g('ams').value, end:g('ame').value, inst:g('ami').value.trim(), cat:k ? k.cat : g('amc').value,
      place:g('amp').value.trim(), genre:g('amg').value, artist:g('ama').value.trim(), fee:g('amf2').value, link:g('aml2').value.trim(), blob:AF.f, w:AF.w, h:AF.h, geo:k ? k.geo : null, venue:k ? k.venue : '', added:Date.now()};
    try { await UDB.put(r); } catch (err) { toast('이 브라우저에는 저장하지 못해서, 이번에만 보여요'); }
    const d = uxItem(r); D.push(d); byId[d.id] = d; uxRefresh(); closeAdd(); toast('전시를 추가했어요'); if (S.tab === 'map') renderMap();
    openDrawer(d.id, {list:[d]});
  });
  check();
}
function closeAdd() {
  const m = $('#addm'); if (!m || !ADDOPEN) return; ADDOPEN = false; m.classList.remove('on'); document.removeEventListener('paste', m._paste);
  if (AF && AF.url) { URL.revokeObjectURL(AF.url); } AF = null; setTimeout(() => { if (!ADDOPEN) m.innerHTML = ''; }, 260);
  const ab = $('#addEx'); if (ab) ab.focus({preventScroll:true});
}
async function delUx(id) { const d = byId[id]; if (!d || !d.user) return; try { await UDB.del(id); } catch (e) {} closeDrawer(); const i = D.indexOf(d); if (i >= 0) D.splice(i, 1); delete byId[id]; PINS = PINS.filter(x => x !== id); savePins(); $('#pn').textContent = PINS.length; uxRefresh(); toast('삭제했어요'); }

/* ---------- 주소(#)에 상태를 담아서 링크로 공유·새로고침해도 그대로 ---------- */
function syncHash(push) {
  const p = new URLSearchParams();
  if (cur && byId[cur] && !byId[cur].user) p.set('e', cur);
  if (S.tab !== 'board') p.set('t', S.tab);
  if (S.q) p.set('q', S.q);
  if (S.cat) p.set('cat', S.cat);
  if (S.fee) p.set('fee', S.fee);
  if (S.quick) p.set('quick', S.quick);
  if (S.month) p.set('m', S.month);
  if (S.sort !== 'new') p.set('sort', S.sort);
  if (S.inst.size) p.set('inst', [...S.inst].join('|'));
  if (S.genre.size) p.set('genre', [...S.genre].join('|'));
  if (S.tag.size) p.set('tag', [...S.tag].join('|'));
  const h = p.toString();
  const u = location.pathname + location.search + (h ? '#' + h : '');
  try { if (push && u !== location.pathname + location.search + location.hash) history.pushState(push, '', u); else history.replaceState(history.state, '', u); } catch (e) {}
  NAVKEY = location.hash;
}
let NAVKEY = null; // 마지막으로 반영한 주소(뒤로가기·해시 바뀜 이벤트가 두 번 와도 한 번만 처리)
const navState = () => JSON.stringify([S.tab, S.q, S.cat, S.fee, S.quick, S.month, S.sort, [...S.inst], [...S.genre], [...S.tag]]);
function hashApply() {
  if (/^#cal\b/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search + '#t=cal&cat=' + encodeURIComponent('졸업 전시')); } catch (e) {} } // 공유용 짧은 주소 #cal = 졸전 달력
  if (/^#grad\b/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search + '#cat=' + encodeURIComponent('졸업 전시') + '&sort=now'); } catch (e) {} } // 공유용 짧은 주소 #grad = 졸업 전시·지금 기준
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  const list = k => (p.get(k) || '').split('|').filter(Boolean);
  S.q = p.get('q') || ''; S.cat = CATS.includes(p.get('cat')) ? p.get('cat') : ''; S.fee = p.get('fee') === '무료' ? '무료' : '';
  S.quick = ['open','ending','soon','past'].includes(p.get('quick')) ? p.get('quick') : '';
  S.month = /^\d{4}-\d\d$/.test(p.get('m') || '') ? p.get('m') : '';
  S.sort = ['now','new','old','end'].includes(p.get('sort')) ? p.get('sort') : 'new';
  S.inst = new Set(list('inst')); S.genre = new Set(list('genre')); S.tag = new Set(list('tag'));
  S.tab = ['board','cal','map','pins'].includes(p.get('t')) ? p.get('t') : 'board';
  $('#q').value = S.q;
  return p.get('e');
}

/* ---------- 공통 ---------- */
function render() {
  document.body.dataset.tab = S.tab;
  if (S.tab!=='cal') clearInterval(CALT);
  if (S.tab==='board') renderBoard(); else if (S.tab==='map') renderMap(); else if (S.tab==='cal') renderCal(); else renderPins();
  $('#hist').style.display = S.tab==='board' ? '' : 'none';
  $('#main').style.bottom = S.tab==='board' ? '' : '0';
}
function update(scroll) {
  const prev = snap();
  const keep = scroll==='keep';
  updateScope(); renderSide(); updateHist(); render();
  const n = apply().length, insts = new Set(apply().map(d=>d.inst)).size;
  syncHash();
  { const sc = $('#scope'), el = sc.querySelector('#segFee [aria-pressed=true], #quick [aria-pressed=true], #segCat button[aria-pressed=true]:not([data-v=""])');
    if (el && sc.scrollWidth > sc.clientWidth) { const r = el.getBoundingClientRect(), sr = sc.getBoundingClientRect(); if (r.right > sr.right - 30 || r.left < sr.left) sc.scrollLeft += r.left - sr.left - 24; } }
  if (!keep) { const m = $('#main'); m.style.scrollBehavior = 'auto'; m.scrollTop = 0; m.style.scrollBehavior = ''; }
  flip(prev);
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.tab = b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x===b));
  moveThumb($('#tabs')); render(); syncHash({tb:1});
  if (!RM && S.tab!=='map') $('#main').animate([{opacity:0, transform:'translateY(10px)'},{opacity:1, transform:'none'}], {duration:300, easing:EASE});
});
$('#q').addEventListener('input', e => { S.q = e.target.value; update(); });
$('#fbtn').onclick = () => { $('#side').classList.add('on'); $('#scrim').classList.add('on'); };
const setSide = (cl, save) => { document.body.classList.toggle('sidecl', cl); const b = $('#stog'); b.setAttribute('aria-expanded', String(!cl)); b.setAttribute('aria-label', cl ? '왼쪽 필터 열기' : '왼쪽 필터 닫기'); if (save) { try { localStorage.setItem('sideClosed', cl ? '1' : ''); } catch (e) {} window.dispatchEvent(new Event('resize')); requestAnimationFrame(thumbs); } };
try { if (localStorage.getItem('sideClosed') === '1') setSide(true); } catch (e) {}
$('#stog').onclick = () => setSide(!document.body.classList.contains('sidecl'), true);
document.addEventListener('keydown', e => {
  if (ADDOPEN) { if (e.key==='Escape') closeAdd(); return; }
  if (e.key==='/' && document.activeElement.tagName!=='INPUT') { e.preventDefault(); $('#q').focus(); }
  else if (e.key==='Escape') { if (cur!==null) closeDrawer(); else if (MOV) closeOver(); else if (MSTICK) { MSTICK = null; hideCard(); } else if (document.activeElement===$('#q')) $('#q').blur(); }
  else if ((e.key==='+' || e.key==='=') && document.activeElement.tagName!=='INPUT') zStep(1);
  else if (e.key==='-' && document.activeElement.tagName!=='INPUT') zStep(-1);
  else if (cur!==null && e.key==='ArrowRight') step(1);
  else if (cur!==null && e.key==='ArrowLeft') step(-1);
});
$('#pn').textContent = PINS.length;
zBtns();
const E0 = hashApply();
buildScope(); buildHist();
document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.t === S.tab));
update(); loadUx();
if (E0 && byId[E0]) openDrawer(E0, {nopush:true});
NAVKEY = location.hash;
const onNav = () => {
  if (location.hash === NAVKEY) return; NAVKEY = location.hash;
  const before = navState(), e = hashApply();
  if (navState() !== before) { document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.t === S.tab)); moveThumb($('#tabs')); update('keep'); }
  if (e && byId[e]) { if (e !== cur) openDrawer(e, {nopush:true}); } else if (cur !== null) closeDrawer({pop:true});
  if (S.tab === 'map' && MOV) closeOver();
};
window.addEventListener('popstate', onNav); window.addEventListener('hashchange', onNav);
const hideBoot = () => { const bt = $('#boot'); if (!bt) return; bt.classList.add('off'); setTimeout(() => bt.remove(), 400); };
requestAnimationFrame(() => requestAnimationFrame(hideBoot)); window.addEventListener('load', () => setTimeout(hideBoot, 150));
const thumbs = () => { ['#tabs','#segCat','#segFee'].forEach(s => moveThumb($(s))); document.documentElement.style.setProperty('--tabsw', ($('#tabs').offsetWidth + 28) + 'px'); };
requestAnimationFrame(thumbs);
if (window.ResizeObserver) { const ro = new ResizeObserver(thumbs); ['#tabs','#segCat','#segFee'].forEach(s => ro.observe($(s))); }
if (document.fonts) { document.fonts.ready.then(thumbs); document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', thumbs); }
window.addEventListener('load', thumbs);
</script>
